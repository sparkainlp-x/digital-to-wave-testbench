name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip ruff
      - run: python -m pip install ".[test]"
      - name: Hash-locked v1-v5 modules and the locked v6, v7 and v8 protocol modules are unchanged
        run: sha256sum -c MODULES.sha256
      - name: Lint (tests and tools; locked modules excluded)
        run: ruff check .
      - name: Tests (full v3, v4 and v5 protocols; reduced v6-v8 runs; two full-size v8 cells vs committed rows)
        run: python -m pytest
      - name: Committed v2-v7 CSV and PNG artifacts are reproduced byte for byte (v8 spot-checked in tests)
        run: |
          cp -r artifacts "$RUNNER_TEMP/committed"
          SKIP_V8=1 tools/reproduce_all.sh
          for f in "$RUNNER_TEMP"/committed/*.csv "$RUNNER_TEMP"/committed/*.png; do
            cmp "$f" "artifacts/$(basename "$f")"
          done
          grep -E '\.(csv|png)$' "$RUNNER_TEMP/committed/SHA256SUMS" | (cd artifacts && sha256sum -c -)
